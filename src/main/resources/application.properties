spring.application.name=asr-api

spring.message.encoding=UTF-8
server.port=8200

# 允许跨域调用 API 的来源，逗号分隔，需完整写出协议、域名和端口，如 http://localhost:8080。
# 默认留空表示不允许跨域（管理后台与 API 同源部署）。不要配置成不可信的地址。
#wfc.cors.allowed_origins=http://localhost:8080

server.adminPort=8000
server.adminPathPrefix=/admin/

# 是否校验客户端身份。开启后，客户端调用 /api 下的接口（/api/hello 除外，包括实时语音识别的 WebSocket 连接）时，
# 需要在 HTTP header authCode 中带上从 IM 服务获取的认证码，本服务调用 IM 服务的管理接口校验认证码，得到用户 ID。
# 升级客户端期间可以临时关闭，兼容还没有带认证码的旧版本客户端。
server.need_auth=true

# IM 服务的管理地址和管理密钥，对应 IM 服务配置文件中的 ${http.admin.port} 和 ${http.admin.secret_key}，用来校验客户端的认证码，不能填错了。
im.admin_url=http://localhost:18080
im.admin_secret=123456

#1M=1048576
asr.max_audio_file_size=1048576
# 下载音频时的 SSRF 防护：默认禁止回环/内网/链路本地/云元数据地址，只允许 http/https。
# 私有化部署如果音频放在内网对象存储（如 http://192.168.1.10:9000/...），需要把主机加到下边白名单，
# 逗号分隔，支持 host 或 host:port。云厂商元数据地址始终禁止。
asr.download.block_private_networks=true
#asr.download.allowed_hosts=minio.internal,192.168.1.10:9000
asr.server_url=http://127.0.0.1:12435/inference
# wf-voice 的 WebSocket 实时识别地址，客户端连接本服务的 /api/stream 后，由本服务转发给 wf-voice
asr.stream_server_url=ws://127.0.0.1:12436
asr.reuse_history=true

asr.use_llm_correct=true
llm.server_url=https://api.deepseek.com/chat/completions
llm.model_name=deepseek-v4-flash
# 大模型服务密钥，如果大模型服务需要认证请填写，例如 OpenAI/通义千问等在线服务；Ollama 本地服务通常无需填写
llm.api_key=sk-XXXX

